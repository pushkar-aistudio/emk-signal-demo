<!DOCTYPE html>
<!-- Review harness only -- iframes the real assets/lockup-open.html unmodified and drives
     its exposed __in()/__showTagline() hooks so it can be watched (and replayed) from a
     static page. Not part of the deliverable itself; that's lockup-open.html. -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Helvetica, sans-serif; background: #f4f4f5; padding: 16px; }
  .frame { width: 100%; aspect-ratio: 1600/900; border: 1px solid #e4e4e7; border-radius: 8px; overflow: hidden; }
  iframe { width: 1600px; height: 900px; border: 0; transform: scale(var(--s)); transform-origin: 0 0; }
  .wrap { width: 100%; height: 0; padding-bottom: 56.25%; position: relative; }
  .wrap > div { position: absolute; inset: 0; overflow: hidden; }
  button { margin-top: 12px; font: inherit; font-weight: 600; padding: 8px 16px; border-radius: 8px; border: 1px solid #d4d4d8; background: #fff; cursor: pointer; }
  button:hover { background: #fafafa; }
</style>
</head>
<body>
  <div class="wrap"><div id="host"></div></div>
  <button id="replay">▶ Replay</button>
<script>
  var host = document.getElementById('host');
  function mount() {
    host.innerHTML = '';
    var f = document.createElement('iframe');
    f.src = '../lockup-open.html';
    var resize = function () {
      var s = host.getBoundingClientRect().width / 1600;
      f.style.transform = 'scale(' + s + ')';
    };
    f.onload = function () {
      resize();
      var w = f.contentWindow;
      w.__in(function () { setTimeout(function () { w.__showTagline(); }, 200); });
    };
    host.appendChild(f);
    window.addEventListener('resize', resize);
  }
  document.getElementById('replay').addEventListener('click', mount);
  mount();
</script>
</body>
</html>
