<!DOCTYPE html>
<!--
  Stable public-facing share page. This is the link the team gets.
  Convention: this file's path and the video's filename (demo.mp4) never change.
  Future beat/assembly updates should just overwrite share/demo.mp4 in place —
  do not rename the video or version this page's path, or the shared link breaks.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMK Signal — Demo</title>
<style>
  :root {
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
  }
  body {
    margin: 0;
    background: #0b0d12;
    background-image: radial-gradient(circle at 50% 0%, #161a24 0%, #0b0d12 60%);
    color: #e8eaed;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 16px;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin: 0 0 20px;
    text-align: center;
    color: #f5f6f8;
  }
  .player {
    width: 100%;
    max-width: 900px;
  }
  video {
    width: 100%;
    max-height: 78vh;
    display: block;
    border-radius: 12px;
    background: #000;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.06);
  }
  footer {
    margin-top: 20px;
    font-size: 0.8rem;
    color: #6b7280;
    text-align: center;
  }
</style>
</head>
<body>
  <h1>EMK Signal — Demo</h1>
  <div class="player">
    <video controls preload="metadata" playsinline>
      <source src="demo.mp4" type="video/mp4">
      Your browser doesn't support embedded video. <a href="demo.mp4">Download the video</a> instead.
    </video>
  </div>
  <footer>EMK Signal</footer>
</body>
</html>
